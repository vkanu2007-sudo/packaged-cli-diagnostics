[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rabtech-env-health"
version = "1.0.0"
description = "A deterministic command-line developer environment diagnostics tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Anusree VK"}]
dependencies = []

[project.scripts]
env-health = "envdoctor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
